<title>Indkøbsliste — Madplanen</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --cream:#F7F3EC;--warm:#FDFAF5;--ink:#1C1917;--ink2:#57534E;--ink3:#A8A29E;
  --terra:#C2522A;--forest:#2D5A3D;--forest-l:#E8F2EB;--gold:#B45309;--gold-l:#FEF3C7;
  --bdr:rgba(28,25,23,0.09);--bdr2:rgba(28,25,23,0.16);--r:12px;--r-sm:8px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Instrument Sans',sans-serif;background:var(--cream);color:var(--ink);font-size:15px;line-height:1.6;padding:28px 24px 80px;max-width:820px;margin:0 auto;}
.ph{margin-bottom:24px;}
.ph h1{font-family:'Playfair Display',serif;font-size:1.9rem;font-weight:700;letter-spacing:-.03em;line-height:1.1;}
.ph p{font-size:14px;color:var(--ink2);margin-top:4px;}
.sum{display:flex;align-items:center;gap:14px;background:var(--warm);border:1px solid var(--bdr2);border-radius:var(--r);padding:14px 18px;margin-bottom:16px;flex-wrap:wrap;}
.sv{display:flex;flex-direction:column;}
.sv-n{font-family:'Playfair Display',serif;font-size:1.5rem;font-weight:700;line-height:1;}
.sv-l{font-size:11px;color:var(--ink3);font-weight:600;text-transform:uppercase;letter-spacing:.05em;margin-top:2px;}
.sdiv{width:1px;height:32px;background:var(--bdr2);}
.ss{flex:1;}
.btns{display:flex;gap:7px;margin-left:auto;}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border:none;border-radius:var(--r-sm);font-family:'Instrument Sans',sans-serif;font-size:13px;font-weight:600;cursor:pointer;transition:all .14s;}
.btn-g{background:transparent;color:var(--ink2);border:1.5px solid var(--bdr2);}
.btn-g:hover{background:var(--cream);color:var(--ink);}
.btn-t{background:var(--terra);color:#fff;}
.btn-t:hover{background:#A84224;}
.sav{background:var(--forest-l);border:1px solid #BBF7D0;border-radius:var(--r);padding:12px 16px;margin-bottom:16px;font-size:13px;color:var(--forest);display:flex;align-items:center;gap:10px;}
.prog{margin-bottom:20px;}
.prog-meta{display:flex;justify-content:space-between;font-size:13px;color:var(--ink2);margin-bottom:5px;}
.prog-track{height:5px;background:var(--bdr2);border-radius:3px;overflow:hidden;}
.prog-fill{height:100%;background:var(--forest);border-radius:3px;transition:width .4s ease;}
.sf-wrap{margin-bottom:20px;}
.sf-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--ink3);margin-bottom:9px;}
.sf-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.sf-pill{display:flex;align-items:center;gap:7px;padding:7px 14px;border-radius:30px;border:2px solid var(--bdr2);background:var(--warm);font-size:13px;font-weight:600;cursor:pointer;transition:all .14s;color:var(--ink2);font-family:'Instrument Sans',sans-serif;user-select:none;}
.sf-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.sf-pill.on{color:var(--ink);border-color:var(--ink);background:var(--warm);}
.sf-pill.on .sf-check{opacity:1;}
.sf-check{opacity:0;font-size:12px;transition:opacity .14s;}
.search-in{padding:8px 14px;border:1.5px solid var(--bdr2);border-radius:30px;font-family:'Instrument Sans',sans-serif;font-size:13px;color:var(--ink);background:var(--warm);outline:none;width:180px;transition:border-color .15s;}
.search-in:focus{border-color:var(--terra);}
.sb{margin-bottom:36px;}
.sh{display:flex;align-items:center;gap:11px;margin-bottom:12px;}
.slogo{width:38px;height:38px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;flex-shrink:0;letter-spacing:-.02em;}
.sname{font-family:'Playfair Display',serif;font-size:1.15rem;font-weight:700;}
.scnt{font-size:13px;color:var(--ink3);}
.stot{margin-left:auto;font-size:13px;font-weight:600;color:var(--ink2);background:var(--cream);padding:4px 12px;border-radius:20px;border:1px solid var(--bdr2);}
.cat-lbl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--ink3);padding:10px 0 6px;display:flex;align-items:center;gap:8px;}
.cat-lbl::after{content:'';flex:1;height:1px;background:var(--bdr);}
.item{display:flex;align-items:center;gap:11px;padding:10px 13px;background:var(--warm);border:1px solid var(--bdr);border-radius:var(--r-sm);margin-bottom:6px;transition:all .13s;cursor:pointer;user-select:none;}
.item:hover{border-color:var(--bdr2);box-shadow:0 2px 8px rgba(28,25,23,.06);}
.item.done{opacity:.45;}
.item.done .iname{text-decoration:line-through;color:var(--ink3);}
.icb{width:20px;height:20px;border-radius:6px;border:2px solid var(--bdr2);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .14s;background:var(--warm);}
.item.done .icb{background:var(--forest);border-color:var(--forest);}
.icb svg{display:none;}
.item.done .icb svg{display:block;}
.iimg{width:44px;height:44px;border-radius:7px;object-fit:contain;background:var(--cream);flex-shrink:0;padding:3px;}
.iph{width:44px;height:44px;border-radius:7px;background:var(--cream);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;}
.iinfo{flex:1;min-width:0;}
.iname{font-size:13px;font-weight:600;color:var(--ink);}
.idesc{font-size:11px;color:var(--ink3);margin-top:1px;}
.iprice{display:flex;flex-direction:column;align-items:flex-end;flex-shrink:0;gap:1px;}
.ipnew{font-family:'Playfair Display',serif;font-size:.95rem;font-weight:700;color:var(--terra);}
.ipold{font-size:11px;color:var(--ink3);text-decoration:line-through;}
.ipnorm{font-family:'Playfair Display',serif;font-size:.95rem;font-weight:700;color:var(--ink2);}
.ibadge{font-size:10px;font-weight:700;background:var(--forest-l);color:var(--forest);padding:2px 7px;border-radius:20px;flex-shrink:0;}
.empty{text-align:center;padding:50px 20px;color:var(--ink3);font-size:14px;}
@media(max-width:600px){
  .sum{gap:10px;}.btns{width:100%;}.btn{flex:1;justify-content:center;}
  .sf-row{gap:6px;}.search-in{width:100%;margin-top:4px;}
}

@media (min-width: 769px) {
  body { padding-top: calc(60px + 36px) !important; }
}
@media (max-width: 768px) {
  body { padding-bottom: calc(68px + env(safe-area-inset-bottom) + 20px) !important; }
}

let checked = new Set();
let activeStores = new Set(Object.keys(STORES_META));
let searchQ = '';

function toggleStore(store) {
  if (activeStores.has(store)) { activeStores.delete(store); }
  else { activeStores.add(store); }
  renderPills(); render();
}

function renderPills() {
  const allOn = activeStores.size === Object.keys(STORES_META).length;
  document.getElementById('sfRow').innerHTML =
    `<div class="sf-pill sf-all${allOn?' on':''}" onclick="toggleAll()">
      ${allOn ? '✓ Alle' : 'Vælg alle'}
    </div>` +
    Object.entries(STORES_META).map(([s, m]) => {
      const on = activeStores.has(s);
      const count = ITEMS.filter(it => it.store === s).length;
      return `<div class="sf-pill${on?' on':''}" onclick="toggleStore('${s}')">
        <div class="sf-dot" style="background:${m.bg}"></div>
        ${s}
        <span style="font-size:11px;color:var(--ink3);font-weight:400">${count}</span>
        <span class="sf-check">✓</span>
      </div>`;
    }).join('') +
    `<input type="text" class="search-in" placeholder="Søg vare…" oninput="doSearch(this.value)" value="${searchQ}">`;
}

function toggleAll() {
  if (activeStores.size === Object.keys(STORES_META).length) {
    activeStores.clear();
  } else {
    Object.keys(STORES_META).forEach(s => activeStores.add(s));
  }
  renderPills(); render();
}

function doSearch(q) { searchQ = q.toLowerCase(); render(); }
function clearAll() { checked.clear(); updateProgress(); render(); }

function toggleItem(idx) {
  if (checked.has(idx)) checked.delete(idx); else checked.add(idx);
  updateProgress(); render();
}

function updateProgress() {
  // Filter to currently visible items based on active store filter
  const visibleItems = ITEMS.filter(it => activeStores.has(it.store));
  const total = visibleItems.length;
  const done = visibleItems.filter((_, i) => {
    const globalIdx = ITEMS.indexOf(visibleItems[i]);
    return checked.has(globalIdx);
  }).length;
  const pct = total ? Math.round((done / total) * 100) : 0;

  // Remaining cost (unchecked visible items)
  const remaining = visibleItems
    .filter((it, i) => !checked.has(ITEMS.indexOf(visibleItems[i])))
    .reduce((s, it) => s + it.price, 0);

  // Total savings across all visible items on sale
  const totalSaved = visibleItems
    .filter(it => it.orig)
    .reduce((s, it) => s + (it.orig - it.price), 0);

  const saleCount = visibleItems.filter(it => it.orig).length;

  document.getElementById('progTxt').textContent = `${done} af ${total} varer lagt i kurv`;
  document.getElementById('progPct').textContent = pct + '%';
  document.getElementById('progFill').style.width = pct + '%';
  document.getElementById('chkVal').textContent = `${done} / ${total}`;
  document.getElementById('totVal').textContent = remaining.toFixed(2).replace('.', ',') + ' kr';
  document.getElementById('savVal').textContent = totalSaved.toFixed(2).replace('.', ',') + ' kr';
  document.getElementById('savText').innerHTML =
    `<strong>${saleCount} varer</strong> er på tilbud — du sparer <strong>${totalSaved.toFixed(2).replace('.', ',')} kr</strong> i forhold til normalprisen.`;
}

function render() {
  const wrap = document.getElementById('listWrap');
  let items = ITEMS.map((it, i) => ({ ...it, idx: i }))
    .filter(it => activeStores.has(it.store))
    .filter(it => !searchQ || it.name.toLowerCase().includes(searchQ) || it.desc.toLowerCase().includes(searchQ));

  if (!items.length) {
    wrap.innerHTML = '<div class="empty">Ingen varer matcher — prøv at aktivere flere butikker</div>';
    return;
  }

  const byStore = {};
  items.forEach(it => {
    if (!byStore[it.store]) byStore[it.store] = {};
    if (!byStore[it.store][it.cat]) byStore[it.store][it.cat] = [];
    byStore[it.store][it.cat].push(it);
  });

  let html = '';
  for (const [store, cats] of Object.entries(byStore)) {
    const m = STORES_META[store] || { bg:'#888', fg:'#fff', short:store[0] };
    const storeItems = Object.values(cats).flat();
    const remaining = storeItems.filter(it => !checked.has(it.idx));
    const storeTotal = remaining.reduce((s, it) => s + it.price, 0);
    const saleCount = storeItems.filter(it => it.orig).length;

    html += `<div class="sb">
      <div class="sh">
        <div class="slogo" style="background:${m.bg};color:${m.fg}">${m.short}</div>
        <div>
          <span class="sname">${store}</span>
          <span class="scnt"> · ${storeItems.length} varer${saleCount ? ` · <span style="color:var(--forest);font-weight:600">${saleCount} på tilbud</span>` : ''}</span>
        </div>
        <div class="stot">ca. ${storeTotal.toFixed(2).replace('.',',')} kr tilbage</div>
      </div>`;

    for (const [cat, catItems] of Object.entries(cats)) {
      html += `<div class="cat-lbl">${cat}</div>`;
      catItems.forEach(it => {
        const isDone = checked.has(it.idx);
        html += `<div class="item${isDone?' done':''}" onclick="toggleItem(${it.idx})">
          <div class="icb">
            <svg width="11" height="9" viewBox="0 0 11 9" fill="none">
              <path d="M1 4L4 7.5L10 1" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
          <div class="iph">${it.emoji}</div>
          <div class="iinfo">
            <div class="iname">${it.name} <span style="font-size:11px;font-weight:400;color:var(--ink3)">${it.desc.split('·')[0].trim()}</span></div>
            <div class="idesc">${it.desc} · <span style="opacity:.7">${it.recipe}</span></div>
          </div>
          ${it.orig
            ? `<div class="iprice">
                <span class="ipnew">${it.price.toFixed(2).replace('.',',')} kr</span>
                <span class="ipold">${it.orig.toFixed(2).replace('.',',')} kr</span>
               </div>
               <div class="ibadge">-${Math.round((1-it.price/it.orig)*100)}%</div>`
            : `<div class="iprice"><span class="ipnorm">${it.price.toFixed(2).replace('.',',')} kr</span></div>`
          }
        </div>`;
      });
    }
    html += '</div>';
  }
  wrap.innerHTML = html;
}

renderPills();
render();
updateProgress();
</script>
