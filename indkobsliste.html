<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Indkøbsliste — Madplanen</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="nav.css">
<script src="auth.js"></script>
<style>
:root{--cream:#F7F3EC;--warm:#FDFAF5;--ink:#1C1917;--ink2:#57534E;--ink3:#A8A29E;--terra:#C2522A;--terra-l:#FBEEE8;--forest:#2D5A3D;--forest-l:#E8F2EB;--gold:#B45309;--gold-l:#FEF3C7;--bdr:rgba(28,25,23,0.09);--bdr2:rgba(28,25,23,0.16);--r:14px;--r-sm:8px;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Instrument Sans',sans-serif;background:var(--cream);color:var(--ink);font-size:15px;line-height:1.6;padding:28px 24px 80px;max-width:820px;margin:0 auto;}
@media(min-width:769px){body{padding-top:calc(60px + 36px)!important;}}
@media(max-width:768px){body{padding-bottom:calc(68px + env(safe-area-inset-bottom) + 20px)!important;}}

.ph{margin-bottom:24px;}
.ph h1{font-family:'Playfair Display',serif;font-size:2rem;font-weight:700;letter-spacing:-.03em;}
.ph p{font-size:14px;color:var(--ink2);margin-top:5px;}

/* SUMMARY */
.summary{display:flex;align-items:center;gap:14px;background:var(--warm);border:1px solid var(--bdr2);border-radius:var(--r);padding:14px 18px;margin-bottom:16px;flex-wrap:wrap;}
.sv{display:flex;flex-direction:column;}
.sv-n{font-family:'Playfair Display',serif;font-size:1.5rem;font-weight:700;line-height:1;}
.sv-l{font-size:11px;color:var(--ink3);font-weight:600;text-transform:uppercase;letter-spacing:.05em;margin-top:2px;}
.sdiv{width:1px;height:32px;background:var(--bdr2);}
.ss{flex:1;}
.btns{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap;}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border:none;border-radius:var(--r-sm);font-family:'Instrument Sans',sans-serif;font-size:13px;font-weight:600;cursor:pointer;transition:all .14s;}
.btn-g{background:transparent;color:var(--ink2);border:1.5px solid var(--bdr2);}
.btn-g:hover{background:var(--cream);color:var(--ink);}
.btn-t{background:var(--terra);color:#fff;}
.btn-t:hover{background:#A84224;}

/* PROGRESS */
.prog{margin-bottom:20px;}
.prog-meta{display:flex;justify-content:space-between;font-size:13px;color:var(--ink2);margin-bottom:5px;}
.prog-track{height:5px;background:var(--bdr2);border-radius:3px;overflow:hidden;}
.prog-fill{height:100%;background:var(--forest);border-radius:3px;transition:width .4s ease;}

/* STORE FILTER */
.sf-wrap{margin-bottom:20px;}
.sf-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--ink3);margin-bottom:9px;}
.sf-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.sf-pill{display:flex;align-items:center;gap:7px;padding:7px 14px;border-radius:30px;border:1.5px solid var(--bdr2);background:var(--warm);font-size:13px;font-weight:600;cursor:pointer;color:var(--ink2);font-family:'Instrument Sans',sans-serif;user-select:none;transition:all .14s;}
.sf-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.sf-pill.on{color:var(--ink);border-color:var(--ink);}
.sf-check{opacity:0;font-size:12px;transition:opacity .14s;}
.sf-pill.on .sf-check{opacity:1;}
.search-in{padding:8px 14px;border:1.5px solid var(--bdr2);border-radius:30px;font-family:'Instrument Sans',sans-serif;font-size:13px;color:var(--ink);background:var(--warm);outline:none;margin-left:auto;width:180px;transition:border-color .15s;}
.search-in:focus{border-color:var(--terra);}

/* SAVINGS */
.sav{background:var(--forest-l);border:1px solid #BBF7D0;border-radius:var(--r);padding:12px 16px;margin-bottom:16px;font-size:13px;color:var(--forest);display:flex;align-items:center;gap:10px;}

/* CATEGORY */
.cat-lbl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--ink3);padding:10px 0 6px;display:flex;align-items:center;gap:8px;}
.cat-lbl::after{content:'';flex:1;height:1px;background:var(--bdr);}

/* ITEM */
.item{display:flex;align-items:center;gap:12px;padding:11px 14px;background:var(--warm);border:1px solid var(--bdr);border-radius:var(--r-sm);margin-bottom:6px;transition:all .14s;cursor:pointer;user-select:none;}
.item:hover{border-color:var(--bdr2);box-shadow:0 2px 8px rgba(28,25,23,.06);}
.item.done{opacity:.45;}
.item.done .iname{text-decoration:line-through;color:var(--ink3);}
.icb{width:20px;height:20px;border-radius:6px;border:2px solid var(--bdr2);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .14s;background:var(--warm);}
.item.done .icb{background:var(--forest);border-color:var(--forest);}
.icb svg{display:none;}
.item.done .icb svg{display:block;}
.iinfo{flex:1;min-width:0;}
.iname{font-size:14px;font-weight:600;color:var(--ink);}
.imeta{font-size:11px;color:var(--ink3);margin-top:1px;}
.iprice{font-family:'Playfair Display',serif;font-size:.95rem;font-weight:700;color:var(--terra);flex-shrink:0;}
.istore{font-size:11px;color:var(--ink3);flex-shrink:0;}
.idel{background:none;border:none;color:var(--ink3);cursor:pointer;padding:4px;border-radius:4px;font-size:16px;line-height:1;flex-shrink:0;}
.idel:hover{color:var(--terra);background:var(--terra-l);}

/* EMPTY */
.empty{text-align:center;padding:50px 20px;color:var(--ink3);}
.empty-icon{font-size:40px;margin-bottom:12px;}
.empty a{color:var(--terra);text-decoration:none;font-weight:600;}
.empty a:hover{text-decoration:underline;}

/* STORE SECTIONS */
.store-section{margin-bottom:28px;}
.store-hdr{display:flex;align-items:center;gap:10px;margin-bottom:12px;padding-bottom:10px;border-bottom:2px solid var(--bdr2);}
.store-logo{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex-shrink:0;}
.store-hdr-name{font-family:'Playfair Display',serif;font-size:1.1rem;font-weight:700;}
.store-hdr-count{font-size:13px;color:var(--ink3);}
.store-hdr-total{margin-left:auto;font-size:13px;font-weight:600;color:var(--ink2);background:var(--cream);padding:4px 12px;border-radius:20px;border:1px solid var(--bdr2);}
</style>
</head>
<body>

<div class="ph">
  <h1>Indkøbsliste</h1>
  <p id="listMeta">Genereret fra madplan og tilvalgte tilbud</p>
</div>

<div class="summary">
  <div class="sv"><span class="sv-n" id="totVal">0 kr</span><span class="sv-l">Estimeret total</span></div>
  <div class="sdiv"></div>
  <div class="sv"><span class="sv-n" style="color:var(--forest)" id="savVal">0 kr</span><span class="sv-l">Du sparer</span></div>
  <div class="sdiv"></div>
  <div class="sv"><span class="sv-n" id="chkVal">0 / 0</span><span class="sv-l">Lagt i kurv</span></div>
  <div class="ss"></div>
  <div class="btns">
    <button class="btn btn-g" onclick="clearChecked()">Ryd afkrydsede</button>
    <button class="btn btn-g" onclick="clearAll()">Ryd alt</button>
    <button class="btn btn-t" onclick="window.print()">Print</button>
  </div>
</div>

<div id="savingsBar" style="display:none" class="sav">
  <span style="font-size:20px">🏷</span>
  <span id="savingsText"></span>
</div>

<div class="prog">
  <div class="prog-meta"><span id="progTxt">0 af 0 varer lagt i kurv</span><strong id="progPct">0%</strong></div>
  <div class="prog-track"><div class="prog-fill" id="progFill" style="width:0%"></div></div>
</div>

<!-- STORE FILTER -->
<div class="sf-wrap">
  <div class="sf-label">Filtrer på butik</div>
  <div class="sf-row" id="sfRow"></div>
</div>

<div id="listWrap"></div>

<script>
const STORE_COLORS = {
  'Netto':{'bg':'#FFDD00','fg':'#1C1917'},
  'Rema 1000':{'bg':'#E31E26','fg':'#fff'},
  'REMA 1000':{'bg':'#E31E26','fg':'#fff'},
  'Lidl':{'bg':'#003399','fg':'#fff'},
  'Føtex':{'bg':'#0063A3','fg':'#fff'},
  'føtex':{'bg':'#0063A3','fg':'#fff'},
  'Bilka':{'bg':'#E3000F','fg':'#fff'},
  'Meny':{'bg':'#00704A','fg':'#fff'},
  'MENY':{'bg':'#00704A','fg':'#fff'},
  'SuperBrugsen':{'bg':'#E30613','fg':'#fff'},
  'Brugsen':{'bg':'#E30613','fg':'#fff'},
  'Spar':{'bg':'#00A651','fg':'#fff'},
  'SPAR':{'bg':'#00A651','fg':'#fff'},
};

let checked = new Set();
let activeStores = new Set();
let searchQ = '';
let shopList = {};

function loadData() {
  try {
    const d = JSON.parse(localStorage.getItem('mp6') || '{}');
    shopList = d.shopList || {};
  } catch(e) { shopList = {}; }
}

function saveData() {
  try {
    const d = JSON.parse(localStorage.getItem('mp6') || '{}');
    d.shopList = shopList;
    localStorage.setItem('mp6', JSON.stringify(d));
  } catch(e) {}
}

function toggleItem(cat, idx) {
  const key = cat + '::' + idx;
  if (checked.has(key)) checked.delete(key);
  else checked.add(key);
  updateProgress();
  render();
}

function deleteItem(cat, idx, event) {
  event.stopPropagation();
  if (shopList[cat]) {
    shopList[cat].splice(idx, 1);
    if (shopList[cat].length === 0) delete shopList[cat];
    saveData();
    render();
    updateProgress();
  }
}

function clearChecked() {
  Object.keys(shopList).forEach(cat => {
    shopList[cat] = shopList[cat].filter((_, i) => !checked.has(cat + '::' + i));
    if (shopList[cat].length === 0) delete shopList[cat];
  });
  checked.clear();
  saveData(); render(); updateProgress();
}

function clearAll() {
  if (!confirm('Ryd hele indkøbslisten?')) return;
  shopList = {}; checked.clear();
  saveData(); render(); updateProgress();
}

function toggleStore(store) {
  if (activeStores.has(store)) activeStores.delete(store);
  else activeStores.add(store);
  renderPills(); render();
}

function toggleAllStores() {
  const stores = getAllStores();
  if (activeStores.size === stores.length) activeStores.clear();
  else stores.forEach(s => activeStores.add(s));
  renderPills(); render();
}

function getAllStores() {
  const stores = new Set();
  Object.values(shopList).flat().forEach(it => { if (it.store) stores.add(it.store); });
  return [...stores].sort();
}

function updateProgress() {
  const allItems = Object.entries(shopList).flatMap(([cat, items]) =>
    items.map((_, i) => cat + '::' + i)
  );
  const total = allItems.length;
  const done = allItems.filter(k => checked.has(k)).length;
  const pct = total ? Math.round((done/total)*100) : 0;
  document.getElementById('progTxt').textContent = `${done} af ${total} varer lagt i kurv`;
  document.getElementById('progPct').textContent = pct + '%';
  document.getElementById('progFill').style.width = pct + '%';
  document.getElementById('chkVal').textContent = `${done} / ${total}`;

  // Totals
  const remaining = Object.entries(shopList).flatMap(([cat, items]) =>
    items.filter((_, i) => !checked.has(cat+'::'+i))
  );
  const total_kr = remaining.filter(i=>i.price).reduce((s,i)=>s+parseFloat(i.price),0);
  document.getElementById('totVal').textContent = total_kr.toFixed(2).replace('.',',') + ' kr';
}

function renderPills() {
  const stores = getAllStores();
  const allOn = activeStores.size === stores.length || activeStores.size === 0;
  document.getElementById('sfRow').innerHTML =
    `<div class="sf-pill${allOn?' on':''}" onclick="toggleAllStores()">
      Alle <span class="sf-check">✓</span>
    </div>` +
    stores.map(s => {
      const on = activeStores.has(s);
      const col = STORE_COLORS[s] || {bg:'#888',fg:'#fff'};
      return `<div class="sf-pill${on?' on':''}" onclick="toggleStore('${s}')">
        <div class="sf-dot" style="background:${col.bg};${s==='Netto'?'border:1px solid #ddd':''}"></div>
        ${s} <span class="sf-check">✓</span>
      </div>`;
    }).join('') +
    `<input type="text" class="search-in" placeholder="Søg vare…" oninput="searchQ=this.value.toLowerCase();render()" value="${searchQ}">`;
}

function render() {
  const wrap = document.getElementById('listWrap');
  const cats = Object.keys(shopList);

  if (!cats.length) {
    wrap.innerHTML = `<div class="empty">
      <div class="empty-icon">🛒</div>
      <div>Indkøbslisten er tom</div>
      <div style="font-size:13px;margin-top:8px">
        <a href="tilbud.html">Tilføj tilbud</a> eller
        <a href="madplan.html">generer en madplan</a>
      </div>
    </div>`;
    return;
  }

  // Group by store if filter is active, otherwise by category
  const showByStore = activeStores.size > 0;

  let html = '';

  if (showByStore) {
    // Show items grouped by store
    const byStore = {};
    cats.forEach(cat => {
      shopList[cat].forEach((item, idx) => {
        const store = item.store || 'Ukendt';
        if (activeStores.size > 0 && !activeStores.has(store)) return;
        if (searchQ && !item.name.toLowerCase().includes(searchQ)) return;
        if (!byStore[store]) byStore[store] = [];
        byStore[store].push({ ...item, cat, idx });
      });
    });

    Object.entries(byStore).sort(([a],[b])=>a.localeCompare(b,'da')).forEach(([store, items]) => {
      const col = STORE_COLORS[store] || {bg:'#888',fg:'#fff'};
      const remaining = items.filter(it => !checked.has(it.cat+'::'+it.idx));
      const storeTotal = remaining.filter(i=>i.price).reduce((s,i)=>s+parseFloat(i.price),0);
      html += `<div class="store-section">
        <div class="store-hdr">
          <div class="store-logo" style="background:${col.bg};color:${col.fg}">${store[0]}</div>
          <span class="store-hdr-name">${store}</span>
          <span class="store-hdr-count">${items.length} varer</span>
          <span class="store-hdr-total">ca. ${storeTotal.toFixed(2).replace('.',',')} kr tilbage</span>
        </div>`;
      items.forEach(it => {
        const key = it.cat+'::'+it.idx;
        const isDone = checked.has(key);
        html += itemHTML(it, key, isDone);
      });
      html += '</div>';
    });
  } else {
    // Show by category
    cats.forEach(cat => {
      const items = shopList[cat].map((item, idx) => ({ ...item, idx }))
        .filter(it => !searchQ || it.name.toLowerCase().includes(searchQ));
      if (!items.length) return;
      html += `<div class="cat-lbl">${cat}</div>`;
      items.forEach(it => {
        const key = cat+'::'+it.idx;
        const isDone = checked.has(key);
        html += itemHTML({...it, cat}, key, isDone);
      });
    });
  }

  wrap.innerHTML = html || `<div class="empty"><div class="empty-icon">🔍</div>Ingen varer matcher søgningen</div>`;
}

function itemHTML(it, key, isDone) {
  // Parse name — format: "Navn · enhed · pris kr (butik)" eller bare "Navn"
  const parts = it.name.split(' · ');
  const displayName = parts[0];
  const meta = parts.slice(1).join(' · ');

  return `<div class="item${isDone?' done':''}" onclick="toggleItem('${it.cat.replace(/'/g,"\\'")}',${it.idx})">
    <div class="icb">
      <svg width="11" height="9" viewBox="0 0 11 9" fill="none">
        <path d="M1 4L4 7.5L10 1" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <div class="iinfo">
      <div class="iname">${displayName}</div>
      ${meta ? `<div class="imeta">${meta}</div>` : ''}
    </div>
    ${it.price ? `<span class="iprice">${parseFloat(it.price).toFixed(2).replace('.',',')} kr</span>` : ''}
    ${it.store && !activeStores.size ? `<span class="istore">${it.store}</span>` : ''}
    <button class="idel" onclick="deleteItem('${it.cat.replace(/'/g,"\\'")}',${it.idx},event)" title="Fjern">×</button>
  </div>`;
}

// ── INIT ──
(async () => {
  const user = await Auth.requireLogin();
  if (!user) return;

  loadData();

  // Init all stores as active
  const stores = getAllStores();
  stores.forEach(s => activeStores.add(s));

  renderPills();
  render();
  updateProgress();
})();
</script>

<script src="nav.js"></script>
<script>buildNav('indkobsliste');</script>
</body>
</html>
